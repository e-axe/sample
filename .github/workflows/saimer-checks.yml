name: Saimer site checks
on:
  pull_request:
    paths: ['saimer-pro/**', '.github/workflows/saimer-checks.yml']
  push:
    branches: [main]
    paths: ['saimer-pro/**', '.github/workflows/saimer-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: saimer-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: saimer-pro
    env:
      TEST_OUTPUT_DIR: ${{ runner.temp }}/saimer-browser-results
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: saimer-pro/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install Pillow
      - run: npm run test:all
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: saimer-browser-failure
          path: ${{ runner.temp }}/saimer-browser-results
          retention-days: 7
