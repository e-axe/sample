name: Validate Yellow Is Dead OGP metadata
on:
  push:
    paths:
      - .github/workflows/import-yellow-is-dead-ogp.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check exact approved OGP asset
        shell: bash
        run: |
          echo "ef4e8ee73080c2361c518f326ba365767c28baf18143fd583ff940e227d3feb1  yellow-is-dead/assets/yellow-is-dead-ogp.jpg" | sha256sum -c -
      - name: Validate Python builder and preview output
        shell: bash
        run: |
          set -euo pipefail
          cd yellow-is-dead
          python3 -m py_compile tools/build.py
          python3 tools/build.py
          python3 - <<'PY'
          from pathlib import Path
          text=Path("index.html").read_text(encoding="utf-8")
          assert '<meta name="robots" content="noindex,nofollow,noarchive">' in text
          assert 'https://e-axe.github.io/sample/yellow-is-dead/assets/yellow-is-dead-ogp.jpg' in text
          assert '<meta name="twitter:card" content="summary_large_image">' in text
          assert '<link rel="canonical"' not in text
          assert '<meta property="og:image:width" content="1200">' in text
          assert '<meta property="og:image:height" content="630">' in text
          print("preview metadata OK")
          PY
          cd ..
          git diff --exit-code -- yellow-is-dead/index.html
      - name: Validate production output and canonical
        shell: bash
        env:
          YELLOW_IS_DEAD_ENV: production
          YELLOW_IS_DEAD_PUBLIC_URL: https://yellow-is-dead.softboiled.net/
        run: |
          set -euo pipefail
          cd yellow-is-dead
          python3 tools/build.py
          python3 - <<'PY'
          from pathlib import Path
          text=Path('index.html').read_text(encoding='utf-8')
          assert '<meta name="robots" content="index,follow,max-image-preview:large">' in text
          assert '<link rel="canonical" href="https://yellow-is-dead.softboiled.net/">' in text
          assert '<meta property="og:url" content="https://yellow-is-dead.softboiled.net/">' in text
          assert 'https://yellow-is-dead.softboiled.net/assets/yellow-is-dead-ogp.jpg' in text
          assert 'noindex' not in text
          assert 'e-axe.github.io' not in text
          print("production metadata OK")
          PY
